name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --ignore-scripts --config.strictDepBuilds=false --config.manage-package-manager-versions=false
      - run: node scripts/verify-build-policy.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run --maxWorkers=4
      - run: node build.mjs
